[build]
  command   = "npm run build:client"
  publish   = "dist/client"

# Proxy all /api/* requests to the Koyeb backend
[[redirects]]
  from   = "/api/*"
  to     = "https://KOYEB_URL_HERE/api/:splat"
  status = 200
  force  = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
